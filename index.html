<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aseguradora del Sur · Mi inspección</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14263f;--muted:#5b6b80;--line:#dde3ea;--soft:#f4f7fa;--p:#0B5CAD;--pd:#0B2E59;--ok:#1f7a5c;--okbg:#e7f4ee;--warn:#9a6400;--warnbg:#fdf3dc;--bad:#b42318;--badbg:#fdecea}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#e9eef4;font:400 16px/1.45 Mulish,Arial,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0b2e5918}
.hd{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.hd img{height:30px;width:auto;display:block}.hd small{color:var(--muted);font-size:12px;text-align:right}
.scr{flex:1;overflow:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:#fff}.nav button{border:0;background:#fff;padding:9px 0 10px;font-size:12px;font-weight:800;color:var(--muted);position:relative}.nav button.on{color:var(--p)}.nav i{display:block;font-style:normal;font-size:19px;line-height:1.2}.nav .b{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
h1{font-size:24px;margin:2px 0 6px;line-height:1.2}h2{font-size:17px;margin:16px 0 6px}.mut{color:var(--muted)}.sm{font-size:13px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 0}.card.hi{border-color:#bcd7f2;background:#f3f8fe}.card.warn{border-color:#f0d48a;background:#fffaf0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;background:var(--p);color:#fff;margin-top:10px;text-align:center;text-decoration:none;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn2{background:#fff;color:var(--p);border:1.5px solid var(--p)}.btn3{background:none;color:var(--muted);border:0;font-weight:700;padding:8px 0}.btnr{background:#fff;color:var(--bad);border:1.5px solid #f1b7b0}
.tl{list-style:none;margin:6px 0;padding:0}.tl li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding-bottom:14px;position:relative}.tl li:before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:before{display:none}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;border:2px solid var(--line);background:#fff;color:var(--muted)}.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}.dot.cur{border-color:var(--p);color:var(--p);box-shadow:0 0 0 4px #0b5cad22}.tl b{display:block}.tl small{color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory}.day{min-width:64px;border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:#fff;scroll-snap-align:start}.day b{display:block;font-size:20px}.day small{font-size:11px;color:var(--muted);display:block}.day.on{border-color:var(--p);background:#eef5fd}.day:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;background:#fff;min-height:58px}.slot.on{border-color:var(--p);background:var(--p);color:#fff}.slot small{display:block;font-weight:600;font-size:11.5px;opacity:.85}.slot:disabled{opacity:.4}
.f{margin:12px 0}.f label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}.f input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px}.f input[aria-invalid=true]{border-color:var(--bad)}.err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:3px}
.map{width:100%;height:170px;border:0;border-radius:12px;background:var(--soft);display:block}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0}.doc .ic{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}.doc .ic img{width:100%;height:100%;object-fit:cover}.doc>div{flex:1;min-width:0}.doc small{display:block;color:var(--muted);font-size:12.5px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:900;white-space:nowrap}.c-p{background:var(--warnbg);color:var(--warn)}.c-r{background:#e8eef6;color:#3d5a80}.c-a{background:var(--okbg);color:var(--ok)}.c-x{background:var(--badbg);color:var(--bad)}
.ok-big{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;margin:20px auto 10px}
.timer{display:flex;align-items:center;gap:8px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;margin:10px 0}
.sheet{position:fixed;inset:0;background:#0b1a2a77;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet>div{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.prueba{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px}.prueba summary{font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer}.prueba .r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prueba button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;display:none;z-index:40;max-width:90vw}

.cam{position:fixed;inset:0;background:#000;z-index:50;color:#fff;overflow:hidden}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cam .mask{position:absolute;inset:0;width:100%;height:100%}
.cTop{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#000a,#0000);z-index:2}.cTop b{font-size:15px}
.cBack{background:#0008;color:#fff;border:1px solid #fff5;border-radius:10px;padding:8px 12px;font-weight:800}
.cMsg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#0009;border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap;z-index:2}.cMsg.ok{background:#1f7a5ce6}
.cChips{position:absolute;left:8px;right:8px;bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;justify-content:center;flex-wrap:wrap;z-index:2}.cChips span{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#0007;border:1px solid #fff4}.cChips .k{border-color:#3ddc97aa}.cChips .w{border-color:#ffc857aa;color:#ffe2a0}
.cShot{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff3;z-index:2}.cShot:not(:disabled){background:#fff}.cShot:disabled{opacity:.45}
.cIgual{position:absolute;right:16px;bottom:calc(44px + env(safe-area-inset-bottom,0px));background:#0009;color:#fff;border:1px solid #fff6;border-radius:12px;padding:9px 12px;font-weight:800;z-index:2}
.cRot{position:absolute;inset:0;background:#0b1a2af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:3}.cRot[hidden]{display:none}
.cam.rev{background:#0b1a2a;display:flex;flex-direction:column}.cam.rev .cTop{position:static}.revImg{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}.revImg img{max-width:100%;max-height:100%;border-radius:10px}.revAct{padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px))}.revAct p{margin:0 0 4px;text-align:center;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.hora{border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-weight:800;background:#fff;font-size:15px}.hora.fija{border-color:#9fd4bd;background:#f2faf6}.hora.red{border-style:dashed}.hora.on{background:var(--p);border-color:var(--p);color:#fff;border-style:solid}
.insp{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line)}.insp .av{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900}.insp small{display:block;color:var(--muted);font-size:12.5px}
.busca{text-align:center}.radar{position:relative;width:86px;height:86px;margin:6px auto 10px}.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--p);opacity:0;animation:rd 2.4s infinite}.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}.radar:after{content:"🔎";position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
@keyframes rd{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){.radar i{animation:none;opacity:.3}}
</style></head><body>

 const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download='inspeccion-'+TP().caso+'.ics';document.body.appendChild(l);l.click();l.remove();}
let docI=null;
// ===== Cámara guiada de documentos (mismo comportamiento que la autoinspección) =====
// Pantalla completa, marco del documento, indicadores abajo (Vertical, Encuadre, Luz, Nitidez, Reflejo) con un único mensaje,
// disparo habilitado cuando todo está bien (o «Tomar igual» tras 6 s), lo que se ve es lo que se guarda (recorte al marco),
// revisión «Usar esta foto / Repetir» y lectura de datos en segundo plano. Respaldo: cámara del sistema si no hay cámara en vivo.
let cam=null,orient={beta:null,gamma:null,mov:0};
addEventListener('deviceorientation',e=>{orient.beta=e.beta;orient.gamma=e.gamma;});
addEventListener('devicemotion',e=>{const a=e.acceleration;if(a&&a.x!=null)orient.mov=Math.hypot(a.x,a.y,a.z);});
async function pedirSensores(){try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();}catch(e){}}
const vertical=()=>{if(orient.beta!=null&&orient.gamma!=null){const b=Math.abs(orient.beta),g=Math.abs(orient.gamma);if(g>55&&b<45)return false;if(b>35||g<35)return true;}return innerHeight>=innerWidth;};
function cajaGuia(guia,W,H){const asp=guia==='hoja'?1/1.414:1.586;let w=W*.9,h=w/asp;if(h>H*.62){h=H*.62;w=h*asp;}return {x:(W-w)/2,y:(H-h)/2-H*.04,w,h};}
async function camara(i){docI=i;const d=S.docs[i];await pedirSensores();
 const div=document.createElement('div');div.className='cam';div.setAttribute('role','dialog');div.setAttribute('aria-label','Cámara: '+d.n);
 div.innerHTML='<video playsinline muted autoplay></video><canvas class="mask"></canvas><div class="cTop"><button class="cBack" id="cx">‹ Volver</button><b>'+esc(d.n)+'</b><span></span></div><div class="cMsg" id="cmsg">Coloca el documento dentro del marco</div><div class="cChips" id="cchips"></div><button class="cShot" id="cshot" aria-label="Tomar la foto" disabled></button><button class="cIgual" id="cigual" hidden>Tomar igual</button><div class="cRot" id="crot" hidden><div style="font-size:42px">📱</div><b>Pon el celular en vertical</b><span>Si no gira, desactiva el bloqueo de rotación.</span><button class="btn btn2" id="crv" style="max-width:240px;background:transparent;color:#fff;border-color:#fff8">‹ Volver</button></div>';
 document.body.appendChild(div);const video=div.querySelector('video'),mask=div.querySelector('.mask');let stream=null,loop=null,inicio=Date.now(),estado={};
 const cerrar=()=>{cancelAnimationFrame(loop);if(stream)stream.getTracks().forEach(t=>t.stop());div.remove();cam=null;};cam={cerrar};
 div.querySelector('#cx').onclick=cerrar;div.querySelector('#crv').onclick=cerrar;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();}
 catch(e){cerrar();return camaraSistema(i);}
 const off=document.createElement('canvas'),ox=off.getContext('2d',{willReadFrequently:true});
 function visible(){const W=innerWidth,H=innerHeight,vw=video.videoWidth,vh=video.videoHeight;if(!vw)return null;const sc=Math.max(W/vw,H/vh);return {W,H,sc,ox:(W-vw*sc)/2,oy:(H-vh*sc)/2};}
 function dibujarMarco(g,ok){const W=innerWidth,H=innerHeight;mask.width=W;mask.height=H;const m=mask.getContext('2d');m.fillStyle='rgba(0,0,0,.55)';m.fillRect(0,0,W,H);m.clearRect(g.x,g.y,g.w,g.h);m.strokeStyle=ok?'#3ddc97':'#fff';m.lineWidth=3;m.setLineDash(ok?[]:[10,7]);m.beginPath();m.roundRect?m.roundRect(g.x,g.y,g.w,g.h,14):m.rect(g.x,g.y,g.w,g.h);m.stroke();m.setLineDash([]);
  m.lineWidth=5;m.strokeStyle=ok?'#3ddc97':'#fff';const L=26;[[g.x,g.y,1,1],[g.x+g.w,g.y,-1,1],[g.x+g.w,g.y+g.h,-1,-1],[g.x,g.y+g.h,1,-1]].forEach(([x,y,sx,sy])=>{m.beginPath();m.moveTo(x,y+sy*L);m.lineTo(x,y);m.lineTo(x+sx*L,y);m.stroke();});}
 function medir(g,r){const N=180,sw=g.w/r.sc,sh=g.h/r.sc,sx=(g.x-r.ox)/r.sc,sy=(g.y-r.oy)/r.sc;off.width=N;off.height=Math.round(N*sh/sw);ox.drawImage(video,sx,sy,sw,sh,0,0,off.width,off.height);
  const D=ox.getImageData(0,0,off.width,off.height).data,w=off.width,h=off.height,Y=new Float32Array(w*h);let sum=0,sat=0;for(let i=0,p=0;i<D.length;i+=4,p++){const v=.299*D[i]+.587*D[i+1]+.114*D[i+2];Y[p]=v;sum+=v;if(v>248)sat++;}
  const media=sum/(w*h);let lap=0,n=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x,v=4*Y[p]-Y[p-1]-Y[p+1]-Y[p-w]-Y[p+w];lap+=v*v;n++;}lap/=n;
  // Encuadre: bordes fuertes cerca de los 4 lados del marco (el documento alineado con la guía)
  const banda=Math.max(3,Math.round(h*.12));const borde=(ys,ye,xs,xe,horiz)=>{let e=0,c=0;for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){const p=y*w+x;const gr=horiz?Math.abs(Y[p+w]-Y[p-w]):Math.abs(Y[p+1]-Y[p-1]);if(gr>28)e++;c++;}return e/c;};
  const lados=[borde(1,banda,4,w-4,true),borde(h-banda,h-1,4,w-4,true),borde(4,h-4,1,banda,false),borde(4,h-4,w-banda,w-1,false)].filter(v=>v>.05).length;
  return {media,sat:sat/(w*h),lap,lados};}
 const CH=[['vert','Vertical'],['enc','Encuadre'],['luz','Luz'],['nit','Nitidez'],['ref','Reflejo']];
 function tick(){const r=visible();if(!r){loop=requestAnimationFrame(tick);return;}const g=cajaGuia(d.guia,r.W,r.H),vert=vertical();div.querySelector('#crot').hidden=vert;
  const m=medir(g,r);estado={vert:vert,enc:m.lados>=3,luz:m.media>70&&m.media<215,nit:m.lap>70&&orient.mov<1.2,ref:m.sat<.06};
  const ok=CH.every(([k])=>estado[k]);dibujarMarco(g,ok);
  div.querySelector('#cchips').innerHTML=CH.map(([k,t])=>'<span class="'+(estado[k]?'k':'w')+'">'+(estado[k]?'✓':'!')+' '+t+'</span>').join('');
  const msg=!vert?'Pon el celular en vertical':!estado.luz?(m.media<=70?'Busca más luz':'Hay demasiada luz'):!estado.ref?'Hay un reflejo: inclina un poco el documento':!estado.enc?'Alinea los bordes del documento con el marco':!estado.nit?'Mantén el celular quieto':'Listo: toma la foto';
  const e=div.querySelector('#cmsg');e.textContent=msg;e.className='cMsg'+(ok?' ok':'');div.querySelector('#cshot').disabled=!ok;div.querySelector('#cigual').hidden=ok||!vert||Date.now()-inicio<6000;loop=requestAnimationFrame(tick);}
 loop=requestAnimationFrame(tick);
 const disparar=(forzada)=>{const r=visible();if(!r)return;const g=cajaGuia(d.guia,r.W,r.H),sw=g.w/r.sc,sh=g.h/r.sc,sx=(g.x-r.ox)/r.sc,sy=(g.y-r.oy)/r.sc,k=Math.min(1,1600/sw);const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  const val=forzada?'Tomada igual (validación no cumplida)':'Validada en el celular';cerrar();revisarFoto(i,c,val);};
 div.querySelector('#cshot').onclick=()=>disparar(false);div.querySelector('#cigual').onclick=()=>disparar(true);}
function camaraSistema(i){toast('Usaremos la cámara del celular');const inp=$('#fCam');inp.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);revisarFoto(i,c,'Cámara del sistema: encuadre no verificado');};im.src=URL.createObjectURL(f);};inp.click();}
function revisarFoto(i,c,val){const d=S.docs[i],url=c.toDataURL('image/jpeg',.85);const div=document.createElement('div');div.className='cam rev';
 div.innerHTML='<div class="cTop"><span></span><b>'+esc(d.n)+'</b><span></span></div><div class="revImg"><img src="'+url+'" alt="Foto tomada"></div><div class="revAct"><p>¿Se lee bien todo el documento?</p><button class="btn" id="rok">Usar esta foto</button><button class="btn btn2" id="rno" style="background:transparent;color:#fff;border-color:#fff8">Repetir</button></div>';
 document.body.appendChild(div);div.querySelector('#rno').onclick=()=>{div.remove();camara(i);};
 div.querySelector('#rok').onclick=()=>{div.remove();const mini=(()=>{const m=document.createElement('canvas'),k=160/Math.max(c.width,c.height);m.width=Math.round(c.width*k);m.height=Math.round(c.height*k);m.getContext('2d').drawImage(c,0,0,m.width,m.height);return m.toDataURL('image/jpeg',.7);})();
  Object.assign(d,{st:'rev',mini,pdf:false,archivo:'',motivo:'',validacion:val,hora:new Date().toLocaleString('es-EC')});S.hist.push({t:Date.now(),a:'Fotografió un documento',d:d.n});guardar();pintar();toast('Documento enviado: lo revisaremos pronto');
  if(d.campos.length)extraer(i,c);};}
// ===== Lectura de datos del documento → campos del formulario (en SIRIUS lo confirma el motor de extracción) =====
let ocrW=null;async function workerOcr(){if(!window.Tesseract)await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc);});if(!ocrW)ocrW=await Tesseract.createWorker('spa');return ocrW;}
function prep(c){const k=Math.max(1,1400/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);const x=o.getContext('2d');x.drawImage(c,0,0,o.width,o.height);const im=x.getImageData(0,0,o.width,o.height),D=im.data;let s=0;for(let i=0;i<D.length;i+=4)s+=.299*D[i]+.587*D[i+1]+.114*D[i+2];const th=s/(D.length/4)*.92;for(let i=0;i<D.length;i+=4){const v=(.299*D[i]+.587*D[i+1]+.114*D[i+2])>th?255:0;D[i]=D[i+1]=D[i+2]=v;}x.putImageData(im,0,0);return o;}
async function extraer(i,c){const d=S.docs[i];try{const w=await workerOcr();const r=await w.recognize(prep(c));const t=(r.data.text||'').toUpperCase().replace(/[|]/g,' '),conf=Math.round(r.data.confidence||0),T=t.replace(/\s+/g,' ');
 const fechas=(T.match(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.](19|20)\d{2}\b/g)||[]);const v={};
 if(d.id==='mat_f'){const p=T.match(/\b([A-Z]{3})[- ]?(\d{3,4})\b/);if(p)v.veh_placa=p[1]+p[2];const vin=T.replace(/[^A-Z0-9 ]/g,'').match(/\b[A-HJ-NPR-Z0-9]{17}\b/);if(vin)v.veh_vin=vin[0];const an=T.match(/\b(19[89]\d|20[0-3]\d)\b/);if(an)v.veh_anio=an[0];}
 if(d.id==='mat_r'){const ced=T.match(/\b\d{10}(001)?\b/);if(ced)v.prop_identificacion=ced[0];if(fechas.length)v.mat_caducidad=fechas[fechas.length-1];}
 if(d.id==='lic_f'){const ced=T.match(/\b\d{10}\b/);if(ced)v.lic_numero=ced[0];const cat=T.match(/\b(?:CATEGOR[IÍ]A|TIPO)\s*:?\s*(A1|A|B|C1|C|D1|D|E1|E|F|G)\b/);if(cat)v.lic_categoria=cat[1];if(fechas.length)v.lic_vencimiento=fechas[fechas.length-1];}
 if(d.id==='rg_bomb'||d.id==='rg_ext'){if(fechas.length)v[d.campos[0]]=fechas[fechas.length-1];}
 if(d.id==='rg_ruc'){const r2=T.match(/\b\d{13}\b/);if(r2)v.rg_ruc=r2[0];}
 if(d.id==='em_mat'||d.id==='em_ficha'){const se=T.replace(/[^A-Z0-9 ]/g,'').match(/\b[A-Z0-9]{8,17}\b/);if(se)v[d.campos[0]]=se[0];}
 if(d.id==='em_lic'){const ced=T.match(/\b\d{10}\b/);if(ced)v.lic_numero=ced[0];if(fechas.length)v.lic_vencimiento=fechas[fechas.length-1];}
 if(d.id==='fac_ext'){const tot=T.match(/TOTAL[^0-9]{0,15}(\d{1,6}[.,]\d{2})/);if(tot)v.ext_factura_valor=tot[1];}
 d.campos.forEach(k=>{S.campos[k]={valor:v[k]||null,conf:v[k]?conf:0,origen:'Portal del cliente · '+d.n,estado:!v[k]?'Sin lectura · lo completa el motor de extracción':conf>=90?'Precargado':'Por confirmar'};});guardar();}
 catch(e){d.campos.forEach(k=>{S.campos[k]={valor:null,conf:0,origen:'Portal del cliente · '+d.n,estado:'Lectura no disponible · lo completa el motor de extracción'};});guardar();}}
function verSirius(){const ks=[...new Set(S.docs.flatMap(d=>d.campos))];const filas=ks.map(k=>{const c=S.campos[k],e=ESPERADO[k];const cmp=c&&c.valor&&e?(c.valor.replace(/\D|-/g,'')===e.replace(/\D|-/g,'')||c.valor===e?'<span class="chip c-a">Coincide</span>':'<span class="chip c-x">No coincide</span>'):'';return '<tr><td>'+CAMPOS[k]+'<br><small class="mut">'+k+'</small></td><td><b>'+esc(c&&c.valor||'—')+'</b>'+(c&&c.conf?'<br><small class="mut">'+c.conf+' %</small>':'')+' '+cmp+'</td><td><small>'+esc(c?c.estado:'Pendiente de la foto')+'</small></td></tr>';}).join('');
 const s=document.createElement('div');s.className='sheet';s.innerHTML='<div style="max-height:85vh;overflow:auto"><b style="font-size:17px">Lo que recibe SIRIUS</b><p class="mut sm" style="margin:4px 0 8px">Campos del formulario llenados con los documentos (el cliente no ve esta pantalla).</p><table class="tbl">'+filas+'</table><button class="btn" id="sx">Cerrar</button></div>';document.body.appendChild(s);s.onclick=e=>{if(e.target===s||e.target.id==='sx')s.remove();};}
// ===== Opciones de prueba (simulan lo que hace la aseguradora) =====
function prueba(){return '<details class="prueba"><summary>Opciones de prueba (simulan acciones de la aseguradora)</summary><div class="r"><span class="sm mut" style="width:100%">Tipo de inspección:</span>'+Object.entries(TIPOS).map(([k,t])=>'<button style="'+(S.tipo===k?'border-color:var(--p);color:var(--p)':'')+'" onclick="cambiarTipo(\''+k+'\')">'+t.nombre+'</button>').join('')+'<span style="width:100%"></span>'+
 (S.etapa==='buscando'?'<button onclick="aceptaRed()">Un inspector de la red acepta</button><button onclick="nadieRed()">Nadie de la red acepta</button>':'')+
 (S.etapa==='agendada'?'<button onclick="S.camino=!S.camino;guardar();pintar()">'+(S.camino?'Quitar':'Simular')+' «va en camino»</button><button onclick="avanzar(\'realizada\')">Marcar inspección realizada</button>':'')+
 (S.etapa==='realizada'?'<button onclick="avanzar(\'revision\')">Pasar a revisión</button>':'')+(S.etapa==='revision'?'<button onclick="avanzar(\'completada\')">Completar la revisión</button>':'')+
 (S.docs.some(d=>d.st==='rev')?'<button onclick="revisarDocs(false)">Rechazar un documento</button><button onclick="revisarDocs(true)">Aceptar documentos</button>':'')+
 '<button onclick="verSirius()">Ver lo que recibe SIRIUS</button><button onclick="if(confirm(\'¿Reiniciar la prueba? Se borra todo.\')){localStorage.removeItem(CLAVE);location.reload()}">Reiniciar la prueba</button></div></details>';}
function cambiarTipo(k){if(k===S.tipo)return;if(!confirm('¿Cambiar a '+TIPOS[k].nombre+'? Se reinicia la prueba.'))return;clearTimeout(busc);S=nuevoEstado(k);guardar();pintar();}
function avanzar(e){S.etapa=e;S.camino=false;guardar();pintar();}
function revisarDocs(ok){const d=S.docs.find(x=>x.st==='rev');if(!d)return;if(ok)S.docs.forEach(x=>{if(x.st==='rev')x.st='ok';});else{d.st='rech';d.motivo='La foto está borrosa: vuelve a tomarla con buena luz y que se lea todo.';}guardar();pintar();toast(ok?'Documentos aceptados':'Un documento necesita una foto nueva');}
// ===== Pintar =====
function pintar(){$('#hcaso').innerHTML='Caso '+TP().caso+'<br>'+esc(TP().nombre);$('#scr').innerHTML=(V[S.paso]||V.estado)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===S.sec));const n=pend(),nb=$('#nb');nb.textContent=n;nb.style.display=n?'':'none';reloj();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='agenda'){S.cambiando=false;ir('agenda',S.cita?'cita':(S.apartado?'lugar':'dia'));}else ir(n,n==='docs'?'docs':'estado');});
vigilar();
if(S.apartado&&Date.now()>S.apartado.hasta)S.apartado=null;
pintar();
</script></body></html>
