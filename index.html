<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aseguradora del Sur · Mi inspección</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14263f;--muted:#5b6b80;--line:#dde3ea;--soft:#f4f7fa;--p:#0B5CAD;--pd:#0B2E59;--ok:#1f7a5c;--okbg:#e7f4ee;--warn:#9a6400;--warnbg:#fdf3dc;--bad:#b42318;--badbg:#fdecea}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#e9eef4;font:400 16px/1.45 Mulish,Arial,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0b2e5918}
.hd{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.hd img{height:30px;width:auto;display:block}.hd small{color:var(--muted);font-size:12px;text-align:right}
.scr{flex:1;overflow:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:#fff}.nav button{border:0;background:#fff;padding:9px 0 10px;font-size:12px;font-weight:800;color:var(--muted);position:relative}.nav button.on{color:var(--p)}.nav i{display:block;font-style:normal;font-size:19px;line-height:1.2}.nav .b{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
h1{font-size:24px;margin:2px 0 6px;line-height:1.2}h2{font-size:17px;margin:16px 0 6px}.mut{color:var(--muted)}.sm{font-size:13px}
.card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 0}.card.hi{border-color:#bcd7f2;background:#f3f8fe}.card.warn{border-color:#f0d48a;background:#fffaf0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;background:var(--p);color:#fff;margin-top:10px;text-align:center;text-decoration:none;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn2{background:#fff;color:var(--p);border:1.5px solid var(--p)}.btn3{background:none;color:var(--muted);border:0;font-weight:700;padding:8px 0}.btnr{background:#fff;color:var(--bad);border:1.5px solid #f1b7b0}
.tl{list-style:none;margin:6px 0;padding:0}.tl li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding-bottom:14px;position:relative}.tl li:before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:before{display:none}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;border:2px solid var(--line);background:#fff;color:var(--muted)}.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}.dot.cur{border-color:var(--p);color:var(--p);box-shadow:0 0 0 4px #0b5cad22}.tl b{display:block}.tl small{color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory}.day{min-width:64px;border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:#fff;scroll-snap-align:start}.day b{display:block;font-size:20px}.day small{font-size:11px;color:var(--muted);display:block}.day.on{border-color:var(--p);background:#eef5fd}.day:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;background:#fff;min-height:58px}.slot.on{border-color:var(--p);background:var(--p);color:#fff}.slot small{display:block;font-weight:600;font-size:11.5px;opacity:.85}.slot:disabled{opacity:.4}
.f{margin:12px 0}.f label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}.f input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px}.f input[aria-invalid=true]{border-color:var(--bad)}.err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:3px}
.map{width:100%;height:170px;border:0;border-radius:12px;background:var(--soft);display:block}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0}.doc .ic{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}.doc .ic img{width:100%;height:100%;object-fit:cover}.doc>div{flex:1;min-width:0}.doc small{display:block;color:var(--muted);font-size:12.5px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:900;white-space:nowrap}.c-p{background:var(--warnbg);color:var(--warn)}.c-r{background:#e8eef6;color:#3d5a80}.c-a{background:var(--okbg);color:var(--ok)}.c-x{background:var(--badbg);color:var(--bad)}
.ok-big{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;margin:20px auto 10px}
.timer{display:flex;align-items:center;gap:8px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;margin:10px 0}
.sheet{position:fixed;inset:0;background:#0b1a2a77;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet>div{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.prueba{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px}.prueba summary{font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer}.prueba .r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prueba button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;display:none;z-index:40;max-width:90vw}
</style></head><body>

 '<p class="mut sm">¿Dudas? Llámanos al <a href="tel:'+CFG.tel+'">'+CFG.telTxt+'</a>.</p>'+prueba();},
dia(){if(S.etapa!=='solicitud'&&!S.cambiando)return V.cita();const dias=proximosDias();if(!S.selF||!dias.some(d=>iso(d)===S.selF)){const pri=dias.find(d=>[0,1,2,3].some(i=>cupos(iso(d),i)>0));S.selF=pri?iso(pri):iso(dias[0]);}
 return '<button class="btn3" onclick="S.cambiando=false;S.selI=null;ir(\'estado\',\'estado\')">‹ Volver</button><h1>'+(S.cambiando?'Elige la nueva fecha':'¿Qué día te queda bien?')+'</h1><p class="mut">Cupos de inspectores en '+CFG.zona+'. Los días sin cupo aparecen apagados.</p><div class="days" role="listbox" aria-label="Días">'+dias.map(d=>{const f=iso(d),tot=[0,1,2,3].reduce((a,i)=>a+cupos(f,i),0);return '<button class="day '+(f===S.selF?'on':'')+'" '+(tot?'':'disabled')+' role="option" aria-selected="'+(f===S.selF)+'" onclick="S.selF=\''+f+'\';S.selI=null;pintar()"><small>'+DS[d.getDay()]+'</small><b>'+d.getDate()+'</b><small>'+MS[d.getMonth()]+'</small></button>';}).join('')+'</div>'+
 '<h2>Elige una franja</h2><div class="slots">'+CFG.franjas.map((fr,i)=>{const c=cupos(S.selF,i);return '<button class="slot '+(S.selI===i?'on':'')+'" '+(c?'':'disabled')+' onclick="S.selI='+i+';pintar()">'+fr.join(' – ')+'<small>'+(c?c+' cupo'+(c>1?'s':''):'Sin cupo')+'</small></button>';}).join('')+'</div><button class="btn" '+(S.selI==null?'disabled':'')+' onclick="apartar()">Continuar</button>';},
lugar(){if(!S.apartado)return V.dia();const l=S.lugar,q=l.lat?l.lat+','+l.lng:'-0.1807,-78.4678',[la,lo]=q.split(',').map(Number),bb=(lo-.006)+','+(la-.004)+','+(lo+.006)+','+(la+.004);
 return '<button class="btn3" onclick="soltar();ir(\'agenda\',\'dia\')">‹ Volver</button><h1>¿Dónde está el vehículo?</h1><div class="timer" id="timer">⏱ Te guardamos el cupo <span id="tt"></span></div>'+
 '<iframe class="map" title="Mapa" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox='+bb+'&layer=mapnik&marker='+la+','+lo+'"></iframe><button class="btn btn2" onclick="ubicar()">📍 Usar mi ubicación actual</button>'+
 fld('dir','Dirección','Ej.: Av. 6 de Diciembre N34-120 y Portugal')+fld('ref','Referencia','Ej.: Edificio Torre Azul, parqueadero subsuelo 2')+fld('quien','¿Quién recibe al inspector?','Nombre y apellido')+fld('cel','Celular de contacto','09XXXXXXXX','tel')+
 '<div class="card"><b>'+fLarga(aFecha(S.apartado.f,'00:00'))+' · '+CFG.franjas[S.apartado.i].join(' – ')+'</b><p class="mut sm" style="margin:4px 0 0">Ten a mano la matrícula y deja el vehículo con espacio alrededor para las fotos.</p></div><button class="btn" onclick="confirmar()">Confirmar la cita</button>';},
ok(){return '<div class="ok-big">✓</div><h1 style="text-align:center">¡Listo! Tu inspección está agendada</h1><p class="mut" style="text-align:center">'+citaTxt()+'<br>Te recordaremos el día anterior.</p><button class="btn btn2" onclick="ics()">Agregar a mi calendario</button><button class="btn" onclick="ir(\'estado\',\'estado\')">Ver mi inspección</button>';},
cita(){if(!S.cita)return '<h1>Tu cita</h1><p class="mut">Aún no tienes cita.</p><button class="btn" onclick="ir(\'agenda\',\'dia\')">Elegir fecha y hora</button>';
 const ini=aFecha(S.cita.f,CFG.franjas[S.cita.i][0]),mh=minutosHabiles(new Date(),ini),puede=mh>=CFG.cambioHorasHabiles*60&&S.etapa==='agendada';
 return '<button class="btn3" onclick="ir(\'estado\',\'estado\')">‹ Volver</button><h1>Tu cita</h1><div class="card hi"><b>'+citaTxt()+'</b><p class="mut" style="margin:4px 0 0">'+esc(S.lugar.dir)+(S.lugar.ref?' · '+esc(S.lugar.ref):'')+'<br>Recibe: '+esc(S.lugar.quien)+' · '+esc(S.lugar.cel)+'</p></div>'+
 '<div class="card"><b>El día de la visita</b><p class="mut sm" style="margin:4px 0 0">Aquí verás el nombre de tu inspector, su credencial y el aviso «Va en camino» con la hora estimada.</p></div>'+
 (puede?'<button class="btn btn2" onclick="S.cambiando=true;S.selI=null;ir(\'agenda\',\'dia\')">Cambiar fecha u hora</button><button class="btn btnr" onclick="cancelar()">Cancelar la cita</button><p class="mut sm">Puedes cambiarla o cancelarla hasta '+CFG.cambioHorasHabiles+' horas hábiles antes.</p>':'<div class="card warn"><b>Ya no se puede cambiar desde aquí</b><p class="sm" style="margin:4px 0 0">Faltan menos de '+CFG.cambioHorasHabiles+' horas hábiles para tu cita.</p><a class="btn btn2" href="tel:'+CFG.tel+'">Llamar a la aseguradora</a></div>')+
 '<button class="btn btn3" onclick="ics()">Agregar a mi calendario</button>';},
docs(){return '<h1>Documentos</h1><p class="mut">Súbelos desde tu celular. Te avisamos cuando los revisemos.</p>'+S.docs.map((d,i)=>{const st={pend:['c-p',d.opc?'Opcional':'Pendiente'],rech:['c-x','Volver a subir'],rev:['c-r','En revisión'],ok:['c-a','Aceptado']}[d.st];
 return '<div class="doc"><span class="ic">'+(d.mini?'<img src="'+d.mini+'" alt="">':d.pdf?'PDF':'📄')+'</span><div><b>'+esc(d.n)+'</b><small>'+esc(d.d)+(d.archivo?' · '+esc(d.archivo):'')+'</small>'+(d.st==='rech'&&d.motivo?'<small style="color:var(--bad);font-weight:700">'+esc(d.motivo)+'</small>':'')+'</div>'+(d.st==='pend'||d.st==='rech'?'<button class="btn" style="width:auto;margin:0;padding:9px 14px;min-height:40px" onclick="elegir('+i+')">Subir</button>':'<span class="chip '+st[0]+'">'+st[1]+'</span>')+'</div>';}).join('')+
 '<p class="mut sm">Fotos o PDF de hasta '+CFG.maxMB+' MB. Tus documentos se usan solo para tu inspección.</p>';},
};
function fld(k,l,ph,t){const v=S.lugar[k]||'',bad=S.errs&&S.errs[k];return '<div class="f"><label for="l_'+k+'">'+l+'</label><input id="l_'+k+'" '+(t?'type="'+t+'" inputmode="numeric"':'')+' value="'+esc(v)+'" placeholder="'+ph+'" aria-invalid="'+(!!bad)+'" oninput="S.lugar.'+k+'=this.value;guardar()">'+(bad?'<div class="err">'+bad+'</div>':'')+'</div>';}
function llegada(){if(!S.cita)return '';const i=aFecha(S.cita.f,CFG.franjas[S.cita.i][0]);const t=new Date(Math.max(Date.now()+25*60000,i.getTime()+20*60000));return p2(t.getHours())+':'+p2(t.getMinutes());}
// ===== Acciones =====
let tmr=null;
function apartar(){S.apartado={f:S.selF,i:S.selI,hasta:Date.now()+CFG.apartadoMin*60000};S.errs=null;guardar();ir('agenda','lugar');}
function soltar(){S.apartado=null;guardar();}
function reloj(){clearInterval(tmr);if(S.paso!=='lugar'||!S.apartado)return;const tick=()=>{const r=S.apartado.hasta-Date.now();if(r<=0){clearInterval(tmr);S.apartado=null;S.selI=null;guardar();toast('El cupo se liberó: elige de nuevo');ir('agenda','dia');return;}const e=$('#tt');if(e)e.textContent=Math.floor(r/60000)+':'+p2(Math.floor(r/1000)%60);};tick();tmr=setInterval(tick,1000);}
function ubicar(){if(!navigator.geolocation){toast('Tu navegador no permite ubicación');return;}toast('Buscando tu ubicación…');navigator.geolocation.getCurrentPosition(p=>{S.lugar.lat=+p.coords.latitude.toFixed(5);S.lugar.lng=+p.coords.longitude.toFixed(5);guardar();pintar();toast('Ubicación marcada en el mapa (± '+Math.round(p.coords.accuracy)+' m)');},()=>toast('No pudimos obtener tu ubicación'),{enableHighAccuracy:true,timeout:12000});}
function confirmar(){const l=S.lugar,e={};if(l.dir.trim().length<8)e.dir='Escribe la dirección completa';if(l.quien.trim().length<3)e.quien='Indica quién recibe al inspector';if(!/^09\d{8}$/.test(l.cel.replace(/\s/g,'')))e.cel='Celular de 10 dígitos que empiece con 09';
 if(Object.keys(e).length){S.errs=e;pintar();toast('Revisa los datos marcados');return;}
 if(Date.now()>S.apartado.hasta){S.apartado=null;guardar();toast('El cupo se liberó: elige de nuevo');ir('agenda','dia');return;}
 const antes=S.cita?citaTxt():null;S.cita={f:S.apartado.f,i:S.apartado.i};S.apartado=null;S.errs=null;S.etapa='agendada';S.cambiando=false;S.hist.push({t:Date.now(),a:antes?'Cambió la cita':'Agendó la inspección',d:citaTxt()+(antes?' (antes: '+antes+')':'')});clearInterval(tmr);ir('agenda','ok');}
function cancelar(){if(!confirm('¿Cancelar la cita? Podrás agendar otra cuando quieras.'))return;S.hist.push({t:Date.now(),a:'Canceló la cita',d:citaTxt()});S.cita=null;S.etapa='solicitud';S.camino=false;toast('Cita cancelada');ir('estado','estado');}
function ics(){if(!S.cita)return;const fr=CFG.franjas[S.cita.i],a=aFecha(S.cita.f,fr[0]),b=aFecha(S.cita.f,fr[1]),f=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aseguradora del Sur//Inspeccion//ES','BEGIN:VEVENT','UID:'+CFG.caso+'-'+S.cita.f+'@asur.ec','DTSTAMP:'+f(new Date()),'DTSTART:'+f(a),'DTEND:'+f(b),'SUMMARY:Inspección de tu vehículo '+CFG.placa,'LOCATION:'+(S.lugar.dir||'').replace(/[,;]/g,' '),'DESCRIPTION:Aseguradora del Sur · caso '+CFG.caso+'. Ten a mano la matrícula.','BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Inspección en 2 horas','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download='inspeccion-'+CFG.caso+'.ics';document.body.appendChild(l);l.click();l.remove();}
let docI=null;
function elegir(i){docI=i;const s=document.createElement('div');s.className='sheet';s.innerHTML='<div><b style="font-size:17px">'+esc(S.docs[i].n)+'</b><p class="mut sm" style="margin:4px 0 8px">'+esc(S.docs[i].d)+'</p><button class="btn" id="sc1">📷 Tomar una foto</button><button class="btn btn2" id="sc2">📁 Elegir foto o PDF</button><button class="btn btn3" id="sc3">Cancelar</button></div>';document.body.appendChild(s);
 s.onclick=e=>{if(e.target===s)s.remove();};s.querySelector('#sc1').onclick=()=>{s.remove();$('#fCam').click();};s.querySelector('#sc2').onclick=()=>{s.remove();$('#fArch').click();};s.querySelector('#sc3').onclick=()=>s.remove();}
async function recibir(file){if(!file||docI==null)return;if(file.size>CFG.maxMB*1048576){toast('El archivo pesa '+(file.size/1048576).toFixed(1)+' MB: máximo '+CFG.maxMB+' MB');return;}
 const d=S.docs[docI],esPdf=file.type==='application/pdf';if(!esPdf&&!file.type.startsWith('image/')){toast('Sube una foto o un PDF');return;}
 let mini=null;if(!esPdf){mini=await new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=160/Math.max(im.width,im.height);c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(im.src);};im.onerror=()=>res(null);im.src=URL.createObjectURL(file);});}
 Object.assign(d,{st:'rev',mini,pdf:esPdf,archivo:file.name.length>28?file.name.slice(0,25)+'…':file.name,motivo:''});S.hist.push({t:Date.now(),a:'Subió un documento',d:d.n});guardar();pintar();toast('Documento enviado: lo revisaremos pronto');}
$('#fCam').onchange=e=>{recibir(e.target.files[0]);e.target.value='';};$('#fArch').onchange=e=>{recibir(e.target.files[0]);e.target.value='';};
// ===== Opciones de prueba (simulan lo que hace la aseguradora) =====
function prueba(){return '<details class="prueba"><summary>Opciones de prueba (simulan acciones de la aseguradora)</summary><div class="r">'+
 (S.etapa==='agendada'?'<button onclick="S.camino=!S.camino;guardar();pintar()">'+(S.camino?'Quitar':'Simular')+' «va en camino»</button><button onclick="avanzar(\'realizada\')">Marcar inspección realizada</button>':'')+
 (S.etapa==='realizada'?'<button onclick="avanzar(\'revision\')">Pasar a revisión</button>':'')+(S.etapa==='revision'?'<button onclick="avanzar(\'completada\')">Completar la revisión</button>':'')+
 (S.docs.some(d=>d.st==='rev')?'<button onclick="revisarDocs(false)">Rechazar un documento</button><button onclick="revisarDocs(true)">Aceptar documentos</button>':'')+
 '<button onclick="if(confirm(\'¿Reiniciar la prueba? Se borra todo.\')){localStorage.removeItem(CLAVE);location.reload()}">Reiniciar la prueba</button></div></details>';}
function avanzar(e){S.etapa=e;S.camino=false;guardar();pintar();}
function revisarDocs(ok){const d=S.docs.find(x=>x.st==='rev');if(!d)return;if(ok)S.docs.forEach(x=>{if(x.st==='rev')x.st='ok';});else{d.st='rech';d.motivo='La foto está borrosa: vuelve a tomarla con buena luz y que se lea todo.';}guardar();pintar();toast(ok?'Documentos aceptados':'Un documento necesita una foto nueva');}
// ===== Pintar =====
function pintar(){$('#scr').innerHTML=(V[S.paso]||V.estado)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===S.sec));const n=pend(),nb=$('#nb');nb.textContent=n;nb.style.display=n?'':'none';reloj();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='agenda'){S.cambiando=false;ir('agenda',S.cita?'cita':(S.apartado?'lugar':'dia'));}else ir(n,n==='docs'?'docs':'estado');});
if(S.apartado&&Date.now()>S.apartado.hasta)S.apartado=null;
pintar();
</script></body></html>
